[project]
name = "layergeom"
version = "0.1.0"
description = "Layer-wise geometry of decoder-only LM hidden states (thesis experiments)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Hidden-state extraction (run on ARC GPUs; pin exact versions once the env is built there).
extract = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.33",
]
# Reference implementations used for cross-checks (GRIDE, binomial ID, k*).
reference = [
    "dadapy>=0.3",
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layergeom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
